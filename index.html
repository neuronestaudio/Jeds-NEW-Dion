    <!-- Prevent pinch-zoom and double-tap zoom on mobile -->
    <script>
      (function () {
        // iOS Safari: prevent pinch (gesturestart) zoom
        window.addEventListener('gesturestart', function (e) {
          e.preventDefault();
        });
        // Prevent ctrl+wheel zoom (some mobile browsers / desktop)
        document.addEventListener(
          'wheel',
          function (e) {
            if (e.ctrlKey) e.preventDefault();
          },
          { passive: false }
        );
        // Prevent double-tap to zoom
        var lastTouchEnd = 0;
        document.addEventListener(
          'touchend',
          function (e) {
            var now = Date.now();
            if (now - lastTouchEnd <= 300) {
              e.preventDefault();
            }
            lastTouchEnd = now;
          },
          { passive: false }
        );
      })();
    </script>
